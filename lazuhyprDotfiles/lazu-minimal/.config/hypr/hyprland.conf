# Default monitor
monitor=,preferred,auto,1

# Apps to be executed on launch
exec-once = waybar &
exec-once = swww init & 
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = udiskie &
exec-once = wal -R --cols16 &
exec-once = hypridle &

# Extra files
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/colors.conf

# Environment variables
env = GDK_BACKEND=wayland,x11 QT_QPA_PLATFORM="wayland;xcb" SDL_VIDEODRIVER=wayland CLUTTER_BACKEND=wayland XDG_CURRENT_DESKTOP=Hyprland XDG_SESSION_TYPE=wayland XDG_SESSION_DESKTOP=Hyprland QT_WAYLAND_DISABLE_WINDOWDECORATION=1 QT_QPA_PLATFORMTHEME=qt5ct

# For AGS
env = XDG_STATE_HOME, $HOME/.local/state
env = ILLOGICAL_IMPULSE_VIRTUAL_ENV, $XDG_STATE_HOME/ags/.venv

# Settings related to input devs
input {
    kb_layout = us

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

general {
    gaps_in = 7
    gaps_out = 13
    border_size = 2
    col.inactive_border = $background
    col.active_border = $inverse_primary

    layout = master
}

decoration {
    rounding = 15

    blur {
        enabled = true
        size = 9
        passes = 3
        ignore_opacity = true
        xray = false
        new_optimizations = true
    }

    # inactive_opacity = 0.95
    # active_opacity = 0.9

    shadow {
        enabled = true
        range = 10
        render_power = 3
        sharp = false
    }

    dim_inactive = false
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsIn, 1, 7, myBezier, slide
    animation = windowsOut, 1, 7, myBezier, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, myBezier, slide
}

misc {
    animate_mouse_windowdragging = false
    disable_hyprland_logo = true
    disable_splash_rendering = true
    enable_swallow = true
    swallow_regex = ^(Alacritty|kitty|footclient|brave-browser)$
}

windowrule = suppress_event maximize, match:class .*

# Remove the right-click menu blurring in Chromium browsers
windowrule = no_blur on, match:class ^()$, match:title ^()$

# Remove the weird pop-up behavior in VSCode
windowrule = no_focus on, match:title ^()$, match:class ^()$

# Blur Waybar
#layerrule = blur on, match:namespace waybar
#layerrule = ignore_alpha 0.5, match:namespace waybar

# Make file picker windows floating
windowrule = float on, center on, match:title ^(Open File|Open|Save|Save As|Export|Import|Choose File), match:class ^(.*)$
windowrule = float on, center on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, center on, match:class ^(Xdg-desktop-portal-gtk)$
hl.window_rule({ match = { class = "Xdg-desktop-portal-gtk" }, border_size = 0 })

# Blur swaync
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window

layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window

# Disable borders for swaync
hl.window_rule({ match = { class = "swaync" }, border_size = 0 })
