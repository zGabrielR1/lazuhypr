# Window rules for Hyprland 0.55+.
# Rules use the current `effect, match:property value` syntax.

# Keep browser windows tiled.
windowrule = tile on, match:title ^(Microsoft-edge)$
windowrule = tile on, match:title ^(Brave-browser)$
windowrule = tile on, match:title ^(Chromium)$

# Small utility windows.
windowrule = float on, match:title ^(pavucontrol)$
windowrule = float on, match:title ^(blueman-manager)$
windowrule = float on, match:title ^(nm-connection-editor)$
windowrule = float on, match:title ^(qalculate-gtk)$

# Browser picture-in-picture.
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = move 69.5% 4%, match:title ^(Picture-in-Picture)$

# Pavucontrol.
windowrule = float on, match:class .*org.pulseaudio.pavucontrol.*
windowrule = size 700 600, match:class .*org.pulseaudio.pavucontrol.*
windowrule = center on, match:class .*org.pulseaudio.pavucontrol.*
windowrule = pin on, match:class .*org.pulseaudio.pavucontrol.*

# Blueman Manager.
windowrule = float on, match:class ^(blueman-manager)$
windowrule = size 800 600, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(blueman-manager)$

# nwg-look.
windowrule = float on, match:class ^(nwg-look)$
windowrule = size 700 600, match:class ^(nwg-look)$
windowrule = move 10% 20%, match:class ^(nwg-look)$
windowrule = pin on, match:class ^(nwg-look)$

# nwg-displays.
windowrule = float on, match:class ^(nwg-displays)$
windowrule = size 900 600, match:class ^(nwg-displays)$
windowrule = move 10% 20%, match:class ^(nwg-displays)$
windowrule = pin on, match:class ^(nwg-displays)$

# Mission Center.
windowrule = float on, match:class ^(io.missioncenter.MissionCenter)$
windowrule = pin on, match:class ^(io.missioncenter.MissionCenter)$
windowrule = center on, match:class ^(io.missioncenter.MissionCenter)$
windowrule = size 900 600, match:class ^(io.missioncenter.MissionCenter)$
windowrule = float on, match:class ^(missioncenter)$, match:title ^(Preferences)$
windowrule = pin on, match:class ^(missioncenter)$, match:title ^(Preferences)$
windowrule = center on, match:class ^(missioncenter)$, match:title ^(Preferences)$

# GNOME Calculator and Hyprland share picker.
windowrule = float on, match:class ^(org.gnome.Calculator)$
windowrule = size 700 600, match:class ^(org.gnome.Calculator)$
windowrule = center on, match:class ^(org.gnome.Calculator)$
windowrule = float on, match:class ^(hyprland-share-picker)$
windowrule = pin on, match:class ^(hyprland-share-picker)$
windowrule = center on, match:class ^(hyprland-share-picker)$
windowrule = size 600 400, match:class ^(hyprland-share-picker)$

# File pickers and manually marked floating apps.
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Open.*Files?|Save.*Files?|All Files|Save)$
windowrule = center on, match:class ^(xdg-desktop-portal-gtk)$, match:title ^(Open.*Files?|Save.*Files?|All Files|Save)$
windowrule = float on, match:class ^(dotfiles-floating)$
windowrule = size 1000 700, match:class ^(dotfiles-floating)$
windowrule = center on, match:class ^(dotfiles-floating)$

# Waypaper.
windowrule = float on, match:class .*waypaper.*
windowrule = size 900 700, match:class .*waypaper.*
windowrule = center on, match:class .*waypaper.*
windowrule = pin on, match:class .*waypaper.*

# Appearance rules.
windowrule = no_blur on, match:tag multimedia_video*
windowrule = opacity 1.0, match:tag multimedia_video*
windowrule = opacity 0.8, match:tag settings*
windowrule = opacity 0.8, match:class ^(org.gnome.Nautilus)$
windowrule = opacity 0.9, match:class ^(gedit|org.gnome.TextEditor|mousepad)$
windowrule = opacity 0.9, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.9, match:class ^(kitty)$
windowrule = opacity 0.85 override 0.7 override 1 override, match:class ^(discord|vesktop|org.telegram.desktop)$
windowrule = opacity 0.8 override 0.6 override 1 override, match:class ^(Spotify)$
windowrule = opacity 0.9 override 0.7 override 1 override, match:class ^(zen)$

# Layer rules.
layerrule = blur on, match:namespace ^(waybar)$
layerrule = ignore_alpha 0.5, match:namespace ^(waybar)$
layerrule = ignore_alpha 0.5, match:namespace ^(notif.*)$
layerrule = blur on, match:namespace ^(logout_dialog)$
layerrule = blur on, match:namespace ^(swaync-control-center)$
layerrule = blur on, match:namespace ^(swaync-notification-window)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-control-center)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-notification-window)$
layerrule = ignore_alpha 0.5, match:namespace ^(swaync-control-center)$
layerrule = ignore_alpha 0.5, match:namespace ^(swaync-notification-window)$
layerrule = xray 0, match:namespace ^(swaync-control-center)$
layerrule = xray 0, match:namespace ^(swaync-notification-window)$

# Prevent the screen from idling while a window is fullscreen.
windowrule = idle_inhibit fullscreen, match:class .*

# XWayland compatibility.
windowrule = no_blur on, match:class ^(resolve)$, match:xwayland true
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# Floating tagged apps.
windowrule = float on, match:tag settings*
windowrule = float on, match:tag viewer*
windowrule = float on, match:tag multimedia_video*
windowrule = size 900 506, match:tag multimedia_video*
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = size 50% 60%, match:class ^(org.pulseaudio.pavucontrol)$

# Do not honor maximize requests; retain the composer's tiling layout.
windowrule = suppress_event maximize, match:class .*

# Common save/open dialogs.
windowrule = float on, match:title ^(Save As|Save a File|Pick Files)$
windowrule = size 50% 60%, match:title ^(Save As|Save a File|Pick Files)$
windowrule = center on, match:title ^(Save As|Save a File|Pick Files)$
windowrule = float on, match:initial_title ^(Open Files)$
windowrule = size 70% 60%, match:initial_title ^(Open Files)$
